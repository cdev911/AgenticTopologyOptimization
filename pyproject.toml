[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fenitop"
version = "0.1.0"
description = "FEniCSx-based topology optimization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.4.6",
  "scipy==1.17.1",
  "pyvista==0.48.4",
  "matplotlib==3.10.9",
  "pydantic==2.13.4",
  "mcp==1.28.1",
]

[project.scripts]
fenitop-validate-config = "fenitop.tools.validate_config:main"
fenitop-run-topopt = "fenitop.tools.run_topopt:main"
fenitop-analyze-results = "fenitop.tools.analyze_results:main"
fenitop-mcp-server = "fenitop.tools.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fenitop*"]
