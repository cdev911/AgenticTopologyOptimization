[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fenitop"
version = "0.1.0"
description = "LLM-guided, deterministic topology optimization with FEniCSx"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
authors = [
  {name = "Chaitanya Dev"},
]
keywords = [
  "topology-optimization",
  "fenicsx",
  "agentic-workflow",
  "crewai",
  "streamlit",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy==2.4.6",
  "scipy==1.17.1",
  "pyvista==0.48.4",
  "matplotlib==3.10.9",
  "pydantic==2.12.5",
  "mcp==1.28.1",
  "crewai==1.15.6",
  "openai==2.48.0",
  "streamlit==1.60.0",
]

[project.urls]
Homepage = "https://github.com/cdev911/AgenticTopologyOptimization"
Repository = "https://github.com/cdev911/AgenticTopologyOptimization"
"Original FEniTop" = "https://github.com/missionlab/fenitop"

[project.scripts]
fenitop-validate-config = "fenitop.tools.validate_config:main"
fenitop-run-topopt = "fenitop.tools.run_topopt:main"
fenitop-analyze-results = "fenitop.tools.analyze_results:main"
fenitop-mcp-server = "fenitop.tools.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic*", "fenitop*"]

[tool.setuptools.package-data]
agentic = ["prompts/*.txt"]
